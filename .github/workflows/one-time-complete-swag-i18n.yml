            'ru': ['Trooper — базовый уровень; Google описывает core-пакет, но названия и итоговое число предметов 2026 ещё не опубликованы.','Trooper — самый широкий пул 2026; Waterfall может переводить сюда участников при заполнении верхних уровней.','Базовый пакет Trooper · оценка ≈5 предметов','Официальный минимум 1+; историческая оценка ≈5 по Trooper 2025.','Ranger получает весь Trooper плюс одну бонусную награду; названия 2026 ещё не опубликованы.','У Ranger отдельный пул; Waterfall не связан с наследованием пакета.','Пакет Trooper + 1 бонус Ranger · оценка ≈6 предметов','Официальный минимум 2+; оценка ≈6 как Trooper ≈5 + бонус.','Champion начинает верхнюю семью наград; Weather-Shield Jacket — первый названный предмет 2026.','У Champion 3 000 слотов; Waterfall определяет переход к следующему пулу.','Верхняя коллекция Champion · оценка ≈6 предметов','Официальный минимум 1+; оценка ≈6 по Champion 2025.','Legend получает весь Champion плюс одну эксклюзивную награду Legend без названия.','Legend — высший уровень 2026 с 2 500 слотами; Waterfall относится к слотам, а не к составу swag.','Пакет Champion + 1 эксклюзив Legend · оценка ≈7 предметов','Официальный минимум 2+; оценка ≈7 по 2025 и правилу Champion+1.'],
            'ar': ['Trooper هو المستوى الأساسي؛ تصفه Google كحزمة swag أساسية، لكن أسماء وعدد عناصر 2026 النهائي لم تُنشر بعد.','Trooper هو أوسع تجمع جوائز في 2026؛ يمكن لـ Waterfall نقل المشاركين إليه عند امتلاء الفئات الأعلى.','حزمة Trooper الأساسية · تقدير ≈5 عناصر','الحد الرسمي 1+؛ تقدير تاريخي ≈5 استنادًا إلى Trooper 2025.','Ranger يحصل على كل Trooper إضافة إلى مكافأة bonus واحدة؛ أسماء 2026 غير معلنة بعد.','لـ Ranger تجمع خاص؛ Waterfall منفصل عن وراثة الحزمة.','حزمة Trooper + مكافأة Ranger واحدة · تقدير ≈6 عناصر','الحد الرسمي 2+؛ تقدير ≈6 من Trooper ≈5 + مكافأة.','Champion يبدأ عائلة المكافآت العليا؛ Weather-Shield Jacket أول عنصر 2026 مُسمى.','Champion لديه 3,000 مقعد؛ Waterfall يحدد الانتقال إلى التجمع التالي.','مجموعة Champion العليا · تقدير ≈6 عناصر','الحد الرسمي 1+؛ تقدير ≈6 وفق Champion 2025.','Legend يحصل على Champion كاملًا إضافة إلى مكافأة Legend حصرية لم يُكشف اسمها بعد.','Legend أعلى فئة في 2026 مع 2,500 مقعد؛ Waterfall يخص المقاعد لا محتوى swag.','حزمة Champion + عنصر Legend حصري · تقدير ≈7 عناصر','الحد الرسمي 2+؛ تقدير ≈7 وفق 2025 وقاعدة Champion+1.'],
