name: Facilitator i18n Preview

on:
  pull_request:
    paths:
      - "app/layout.tsx"
      - "app/redesign-calculator.tsx"
      - "app/dashboard/**"
      - "app/**/dashboard/**"
      - "components/arcade/**"
      - "components/i18n/**"
      - "lib/website-i18n.ts"
      - "public/i18n/locales/**"
      - "scripts/generate-website-i18n.mjs"
      - ".github/workflows/facilitator-i18n-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vietnamese-drawer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build
        run: yarn build

      - name: Start production server
        run: |
          yarn start --hostname 127.0.0.1 --port 3000 > /tmp/gcsb-web.log 2>&1 &
          yarn wait-on http://127.0.0.1:3000/vi/

      - name: Verify rendered Vietnamese Facilitator UI
        run: |
          mkdir -p screenshots
          node <<'NODE'
          const { chromium } = require('playwright')
          const vi = require('./public/i18n/locales/vi.json')

          ;(async () => {
            const browser = await chromium.launch({ headless: true, channel: 'chrome' })
            const page = await browser.newPage({ viewport: { width: 430, height: 932 } })
            const catalogRequests = []

            page.on('request', (request) => {
              const url = new URL(request.url())
              if (url.pathname.includes('/i18n/') && url.pathname.endsWith('.json')) {
                catalogRequests.push(url)
              }
            })

            await page.addInitScript(() => {
              const profileUrl =
                'https://www.skills.google/public_profiles/f41c688e-40d2-489d-9850-123456789abc'
              window.localStorage.setItem('arcade-points-locale', 'vi')
              window.localStorage.setItem(
                'eplus-arcade-dashboard-v1',
                JSON.stringify({
                  profileUrl,
                  result: {
                    success: true,
                    badges: [],
                    game: [],
                    skill: [],
                    special: [],
                    arcadePoints: { totalPoints: 28 },
                    faciCounts: { faciGame: 5, faciSkill: 23 },
                  },
                }),
              )
            })

            await page.goto('http://127.0.0.1:3000/vi/dashboard/', {
              waitUntil: 'domcontentloaded',
            })

            await page.locator('.arcade-dashboard-page[data-dashboard-view="profile"]').waitFor()

            const facilitatorOption = page
              .locator('.analyzer-facilitator-option')
              .filter({ has: page.locator('input[type="checkbox"]') })
              .filter({ hasText: vi.additional['__profileOption:participating'] })
            await facilitatorOption.waitFor()

            if (
              catalogRequests.length < 2 ||
              catalogRequests.some((url) => !url.searchParams.get('v'))
            ) {
              throw new Error(
                `Locale catalogs are not cache-busted: ${catalogRequests
                  .map((url) => url.toString())
                  .join(', ')}`,
              )
            }

            await facilitatorOption.locator('input[type="checkbox"]').check()

            const autoFetchOption = page
              .locator('.analyzer-facilitator-option')
              .filter({ hasText: vi.additional['__profileOption:autoFetch'] })
            await autoFetchOption.waitFor()
            await autoFetchOption.getByText(
              vi.additional['__profileOption:autoFetchDescription'],
              { exact: true },
            ).waitFor()

            if (await page.getByText('Xem chi tiết chương trình', { exact: true }).count()) {
              throw new Error('Removed program details action is still rendered')
            }

            // Acknowledge the first-visit notice before using the mobile launcher.
            const cookieNotice = page.locator('.cookie-consent-button')
            if (await cookieNotice.isVisible()) await cookieNotice.click()
            await page.locator('.cookie-consent-layer').waitFor({ state: 'hidden' })

            const launcher = page.locator('.facilitator-launcher')
            await launcher.waitFor({ state: 'visible' })
            await launcher.click()

            const drawer = page.locator('.facilitator-drawer')
            await drawer.waitFor()
            await drawer.getByText(/Tổng điểm Arcade/).first().waitFor()
            await drawer
              .getByText(vi.additional['2026 syllabus badge checklist'], { exact: true })
              .waitFor()

            const markCompleted = drawer
              .locator('.bonus-milestone-confirmation-button')
              .filter({ hasText: vi.additional['Mark completed'] })
            await markCompleted.waitFor({ state: 'attached' })
            await markCompleted.scrollIntoViewIfNeeded()
            await drawer
              .getByText(vi.additional['View 4 GEAR skill badges · 0/4'], { exact: true })
              .waitFor({ state: 'attached' })
            await markCompleted.click()

            const completedTitle = drawer.getByText(
              vi.additional['Bonus Milestone completed'],
              { exact: true },
            )
            await completedTitle.waitFor({ state: 'attached' })
            const bonusApplied = drawer.getByText(
              vi.additional['+10 bonus applied. Open to review the completed steps.'],
              { exact: true },
            )
            await bonusApplied.waitFor({ state: 'attached' })

            const openDetails = drawer
              .locator('.bonus-milestone-confirmation-button')
              .filter({ hasText: vi.additional['Open details'] })
            await openDetails.waitFor({ state: 'attached' })
            await openDetails.scrollIntoViewIfNeeded()
            await openDetails.click()

            const closeDetails = drawer
              .locator('.bonus-milestone-confirmation-button')
              .filter({ hasText: vi.additional['Close details'] })
            const undo = drawer
              .locator('.bonus-milestone-confirmation-button')
              .filter({ hasText: vi.additional['Undo'] })
            await closeDetails.waitFor({ state: 'attached' })
            await undo.waitFor({ state: 'attached' })
            await drawer
              .getByText(
                vi.additional['Completion is saved. Close the details again or undo if needed.'],
                { exact: true },
              )
              .waitFor({ state: 'attached' })

            await page.screenshot({
              path: 'screenshots/facilitator-mobile-vi-430x932.png',
              fullPage: true,
            })

            const text = await drawer.innerText()
            const forbiddenEnglishUi = [
              'Confirm program participation, track milestone bonuses',
              'Participating in Facilitator Program',
              'Automatically fetch latest data',
              'Refresh the saved profile once whenever this page is opened.',
              'Overall Arcade points',
              'Estimated total after bonus',
              '2026 syllabus badge checklist',
              'Participation off',
              'Read official guide',
              'Submit verification form',
              'Bonus Milestone completed',
              '+10 bonus applied. Open to review the completed steps.',
              'Completion is saved. Close the details again or undo if needed.',
              'Confirm after you finish all required steps above.',
              'Open details',
              'Close details',
              'Mark completed',
              'View 4 GEAR skill badges',
              'Hide GEAR skill badges',
              'Undo',
            ]
            const leaks = forbiddenEnglishUi.filter((value) => text.includes(value))
            if (leaks.length) {
              throw new Error(`Untranslated Facilitator UI: ${[...new Set(leaks)].join(', ')}`)
            }

            const mutationQueueResult = await page.evaluate(async () => {
              const first = document.createElement('span')
              const second = document.createElement('span')
              first.dataset.i18nMutationProbe = 'first'
              second.dataset.i18nMutationProbe = 'second'
              document.body.append(first, second)

              await new Promise((resolve) => requestAnimationFrame(() => resolve()))
              await new Promise((resolve) => requestAnimationFrame(() => resolve()))

              first.textContent = 'Overall Arcade points'
              await Promise.resolve()
              second.textContent = 'Estimated total after bonus'

              await new Promise((resolve) => requestAnimationFrame(() => resolve()))
              await new Promise((resolve) => requestAnimationFrame(() => resolve()))

              const result = [first.textContent, second.textContent]
              first.remove()
              second.remove()
              return result
            })

            const expectedMutationTranslations = [
              vi.additional['Overall Arcade points'],
              vi.additional['Estimated total after bonus'],
            ]
            if (
              mutationQueueResult.length !== expectedMutationTranslations.length ||
              mutationQueueResult.some(
                (value, index) => value !== expectedMutationTranslations[index],
              )
            ) {
              throw new Error(
                `Queued DOM translations were dropped: ${JSON.stringify(mutationQueueResult)}`,
              )
            }

            await browser.close()
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facilitator-i18n-preview
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
