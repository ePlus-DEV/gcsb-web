name: Mirror Arcade Swag GIF Assets (one-time)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  mirror:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/mirror-arcade-2026-swag-images'
    runs-on: ubuntu-latest
    concurrency:
      group: arcade-swag-assets-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download and validate all official swag GIFs
        run: node scripts/mirror-arcade-swag-images.mjs
      - name: Commit binary assets and local image paths to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/swag/2026 components/arcade/swag-drops.ts
          if git diff --cached --quiet; then
            echo "All gift GIFs are already mirrored."
            exit 0
          fi
          git commit -m "assets(arcade): self-host official 2026 swag GIFs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
