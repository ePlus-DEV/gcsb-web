            },
          }

          const locales = ['en','vi','ja','ko','zh_CN','fr','de','es','pt_BR','it','ru','ar','hi']
          for (const locale of locales) {
            const file = `public/i18n/locales/${locale}.json`
            const data = JSON.parse(fs.readFileSync(file, 'utf8'))
            data.additional ||= {}
            Object.assign(data.additional, translations[locale])
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`)
          }

          const libPath = 'lib/website-i18n.ts'
          let lib = fs.readFileSync(libPath, 'utf8')
          const marker = '  return source\n}\n'
          if (!lib.includes('__swag:knownNow')) {
            const dynamic = `  match = source.match(/^(\\d+) known now · ≈(\\d+) still unrevealed$/)\n  if (match) {\n    return (targetCatalog.additional["__swag:knownNow"] ?? "{known} known now · ≈{unrevealed} still unrevealed")\n      .replace("{known}", match[1])\n      .replace("{unrevealed}", match[2])\n  }\n\n  match = source.match(/^(\\d+) revealed · (\\d+) pending$/)\n  if (match) {\n    return (targetCatalog.additional["__swag:revealedPending"] ?? "{revealed} revealed · {pending} pending")\n      .replace("{revealed}", match[1])\n      .replace("{pending}", match[2])\n  }\n\n  match = source.match(/^([\\d,]+) total prize slots$/)\n  if (match) {\n    return (targetCatalog.additional["__swag:totalPrizeSlots"] ?? "{count} total prize slots").replace("{count}", match[1])\n  }\n\n  match = source.match(/^(\\d+)% left$/)\n  if (match) {\n    return (targetCatalog.additional["__swag:percentLeft"] ?? "{percent}% left").replace("{percent}", match[1])\n  }\n\n  match = source.match(/^2025 baseline: (\\d+)$/)\n  if (match) {\n    return (targetCatalog.additional["__swag:baseline"] ?? "2025 baseline: {count}").replace("{count}", match[1])\n  }\n\n  match = source.match(/^≈(\\d+)(?: projected)? items$/)\n  if (match) {\n    return (targetCatalog.additional["__swag:projectedItems"] ?? "≈{count} projected items").replace("{count}", match[1])\n  }\n\n`
            if (!lib.includes(marker)) throw new Error('translateDynamicText return marker not found')
            lib = lib.replace(marker, dynamic + marker)
            fs.writeFileSync(libPath, lib)
          }

          const required = [...Object.values(S), '__swag:knownNow', '__swag:revealedPending', '__swag:totalPrizeSlots', '__swag:percentLeft', '__swag:baseline', '__swag:projectedItems']
          const test = `import assert from "node:assert/strict"\nimport { readFileSync } from "node:fs"\nimport test from "node:test"\n\nconst locales = ${JSON.stringify(locales)}\nconst required = ${JSON.stringify(required)}\n\ntest("swag UI copy exists in every locale catalog", () => {\n  for (const locale of locales) {\n    const catalog = JSON.parse(readFileSync(new URL(\`../public/i18n/locales/\${locale}.json\`, import.meta.url), "utf8"))\n    for (const source of required) {\n      assert.equal(typeof catalog.additional?.[source], "string", \`\${locale} missing swag translation: \${source}\`)\n      assert.ok(catalog.additional[source].trim().length > 0, \`\${locale} has empty swag translation: \${source}\`)\n    }\n  }\n})\n\ntest("dynamic swag translation patterns are wired through website i18n", () => {\n  const source = readFileSync(new URL("../lib/website-i18n.ts", import.meta.url), "utf8")\n  for (const key of ["knownNow", "revealedPending", "totalPrizeSlots", "percentLeft", "baseline", "projectedItems"]) {\n    assert.match(source, new RegExp(\`__swag:\${key}\`))\n  }\n})\n`
          fs.writeFileSync('tests/swag-i18n.test.mjs', test)
          NODE

      - name: Commit generated source-catalog updates
        shell: bash
        run: |
          rm .github/workflows/one-time-swag-i18n.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: translate swag pages"
          git push origin HEAD:fix/swag-i18n
