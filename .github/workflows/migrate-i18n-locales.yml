name: Migrate i18n locale sources

on:
  push:
    branches:
      - fix/bonus-milestone-auto-close
    paths:
      - "scripts/migrate-i18n-to-locales.mjs"
      - ".github/workflows/migrate-i18n-locales.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Expand locale catalogs
        run: node scripts/migrate-i18n-to-locales.mjs

      - name: Commit locale source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/i18n/locales/*.json
          if git diff --cached --quiet; then
            echo "Locale source files already match the generated catalogs."
            exit 0
          fi
          git commit -m "Expand i18n into per-locale source files"
          git push origin HEAD:fix/bonus-milestone-auto-close
