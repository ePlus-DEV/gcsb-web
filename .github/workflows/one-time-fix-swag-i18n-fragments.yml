name: One-time fix swag i18n fragments

on:
  push:
    branches: [fix/swag-i18n]
    paths: [.github/workflows/one-time-fix-swag-i18n-fragments.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/swag-i18n
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make dynamic UI strings single translatable nodes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'app/swag-drops/2026/page.tsx': [
              ('{meta.slots.toLocaleString("en-US")} total prize slots', '{`${meta.slots.toLocaleString("en-US")} total prize slots`}'),
              ('{knownCount} known now · ≈{projectedMystery} still unrevealed', '{`${knownCount} known now · ≈${projectedMystery} still unrevealed`}'),
              ('≈{meta.historicalEstimateItems} items', '{`≈${meta.historicalEstimateItems} items`}'),
              ('2025 baseline: {PREVIOUS_SEASON_COUNTS[tier]}', '{`2025 baseline: ${PREVIOUS_SEASON_COUNTS[tier]}`}'),
              ('{drops.length} revealed · {promised.length} pending', '{`${drops.length} revealed · ${promised.length} pending`}'),
              ('<Sparkles className="h-3.5 w-3.5" aria-hidden="true" /> 2026 swag drop #{latest.dropNumber}', '<Sparkles className="h-3.5 w-3.5" aria-hidden="true" /> {`${season} swag drop #${latest.dropNumber}`}'),
              ('{PREVIOUS_SEASON_COUNTS[tier]} items', '{`${PREVIOUS_SEASON_COUNTS[tier]} items`}'),
              ('Shared by {item.author}', '{`Shared by ${item.author}`}'),
            ],
            'app/swag-drops/2026/[slug]/page.tsx': [
              ('{season} package outlook', '{`${season} package outlook`}'),
              ('{meta.historicalEstimateLabel} projected rewards', '{`${meta.historicalEstimateLabel} projected rewards`}'),
              ('{meta.slots.toLocaleString("en-US")} total prize slots', '{`${meta.slots.toLocaleString("en-US")} total prize slots`}'),
              ('What we know about the {season} package', '{`What we know about the ${season} package`}'),
              ('<span className="mt-1 block text-xs text-slate-500">2026 drop #{drop.dropNumber} · {drop.revealedOn}</span>', '<span className="mt-1 block text-xs text-slate-500">{`${season} drop #${drop.dropNumber} · ${drop.revealedOn}`}</span>'),
              ('≈{projectedRemaining} more item{projectedRemaining === 1 ? "" : "s"} still unrevealed', '{`≈${projectedRemaining} more item${projectedRemaining === 1 ? "" : "s"} still unrevealed`}'),
              ('2025 {meta.label} package', '{`2025 ${meta.label} package`}'),
              ('← All {season} rewards', '{`← All ${season} rewards`}'),
              ('2026 swag drop #{drop.dropNumber}', '{`${season} swag drop #${drop.dropNumber}`}'),
              ('<p className="mt-4 text-sm font-semibold text-cyan-700 dark:text-cyan-300">Revealed {drop.revealedOn}</p>', '<p className="mt-4 text-sm font-semibold text-cyan-700 dark:text-cyan-300">{`Revealed ${drop.revealedOn}`}</p>'),
              ('All {season} rewards <ArrowRight', '{`All ${season} rewards`} <ArrowRight'),
            ],
            'app/swag-drops/page.tsx': [
              ('Season {season}', '{`Season ${season}`}'),
              ('Trooper, Ranger, Champion, and Legend requirements plus every confirmed {season} swag drop.', '{`Trooper, Ranger, Champion, and Legend requirements plus every confirmed ${season} swag drop.`}'),
              ('{drops.length} confirmed {drops.length === 1 ? "drop" : "drops"}', '{`${drops.length} confirmed ${drops.length === 1 ? "drop" : "drops"}`}'),
              ('Latest: {latest.shortName}', '{`Latest: ${latest.shortName}`}'),
            ],
            'components/arcade/live-tier-slots.tsx': [
              ('{remainingPercent.toFixed(0)}% left', '{`${remainingPercent.toFixed(0)}% left`}'),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              if old not in text:
                print(f'WARN missing replacement in {filename}: {old}')
                continue
              text = text.replace(old, new)
            path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/swag-drops components/arcade/live-tier-slots.tsx
          git commit -m "fix: make swag dynamic copy translatable"
          git push origin HEAD:fix/swag-i18n
