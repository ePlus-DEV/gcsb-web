name: Visual Preview

on:
  pull_request:
    paths:
      - "app/**"
      - "components/arcade/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.mjs"
      - ".github/workflows/visual-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build
        run: yarn build

      - name: Install Playwright runtime
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          yarn start --hostname 127.0.0.1 --port 3000 > /tmp/gcsb-web.log 2>&1 &
          npx --yes wait-on@8 http://127.0.0.1:3000

      - name: Capture empty, manual and mobile states
        run: |
          mkdir -p screenshots
          node <<'NODE'
          const { chromium } = require('playwright')

          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } })

            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' })
            await page.screenshot({
              path: 'screenshots/arcade-desktop-empty-1440x900.png',
              fullPage: false,
            })

            await page.getByRole('button', { name: 'Enter points manually' }).click()
            await page.screenshot({
              path: 'screenshots/arcade-desktop-manual-1440x900.png',
              fullPage: false,
            })

            await page.setViewportSize({ width: 390, height: 844 })
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' })
            await page.screenshot({
              path: 'screenshots/arcade-mobile-empty-390x844.png',
              fullPage: false,
            })

            await browser.close()
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: arcade-visual-preview
          path: screenshots/*.png
          retention-days: 14
