name: Visual Preview

on:
  pull_request:
    paths:
      - "app/**"
      - "components/arcade/**"
      - "components/i18n/**"
      - "components/seo/**"
      - "lib/website-i18n.ts"
      - "public/i18n/**"
      - "scripts/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.mjs"
      - ".github/workflows/visual-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build
        run: yarn build

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Start production server
        run: |
          yarn start --hostname 127.0.0.1 --port 3000 > /tmp/gcsb-web.log 2>&1 &
          yarn wait-on http://127.0.0.1:3000

      - name: Capture desktop and mobile states
        run: |
          mkdir -p screenshots
          node <<'NODE'
          const { chromium } = require('playwright')

          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } })

            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' })
            await page.getByRole('button', { name: 'Analyze profile' }).waitFor()

            const languageTrigger = page.locator('.website-language-trigger')
            await languageTrigger.waitFor()
            const languageIcon = languageTrigger.locator(':is(.fa-icon, svg)').first()
            const languageIconClass = (await languageIcon.getAttribute('class')) ?? ''
            const hasGlobeIcon =
              languageIconClass.includes('fa-globe') ||
              languageIconClass.includes('lucide-globe')
            if (!hasGlobeIcon || languageIconClass.includes('firefox')) {
              throw new Error(`Unexpected language selector icon: ${languageIconClass}`)
            }
            if ((await languageTrigger.getAttribute('aria-expanded')) !== 'false') {
              throw new Error('Language popover starts open unexpectedly')
            }

            await page.screenshot({
              path: 'screenshots/arcade-desktop-empty-1440x900.png',
              fullPage: false,
            })

            await languageTrigger.click()
            const languageMenu = page.locator('.website-language-menu')
            await languageMenu.waitFor()
            const languageOptions = page.locator('.website-language-option')
            if ((await languageOptions.count()) !== 13) {
              throw new Error(`Unexpected language option count: ${await languageOptions.count()}`)
            }
            if ((await languageTrigger.getAttribute('aria-expanded')) !== 'true') {
              throw new Error('Language trigger did not expose its open state')
            }
            await page.screenshot({
              path: 'screenshots/arcade-desktop-language-menu-1440x900.png',
              fullPage: false,
            })
            await languageTrigger.click()

            const lightPage = await browser.newPage({
              viewport: { width: 1440, height: 900 },
            })
            await lightPage.addInitScript(() => {
              window.localStorage.setItem('arcade-theme', 'light')
            })
            await lightPage.goto('http://127.0.0.1:3000', {
              waitUntil: 'networkidle',
            })
            await lightPage.locator('html.light').waitFor()
            await lightPage.getByRole('button', { name: 'Analyze profile' }).waitFor()

            const lightSurfaceSelectors = [
              '.website-language-trigger',
              '.facilitator-launcher',
              '.dashboard-empty-state',
            ]
            for (const selector of lightSurfaceSelectors) {
              const surface = lightPage.locator(selector)
              await surface.waitFor()
              const paint = await surface.evaluate((element) => {
                const style = window.getComputedStyle(element)
                return `${style.backgroundColor} ${style.backgroundImage}`
              })
              if (
                paint.includes('rgb(5, 9, 24)') ||
                paint.includes('rgb(7, 14, 31)') ||
                paint.includes('rgb(10, 28, 54)')
              ) {
                throw new Error(`Dark light-theme surface for ${selector}: ${paint}`)
              }
            }

            await lightPage.screenshot({
              path: 'screenshots/arcade-desktop-light-1440x900.png',
              fullPage: false,
            })

            await lightPage.locator('.website-language-trigger').click()
            await lightPage.locator('.website-language-menu').waitFor()
            await lightPage.screenshot({
              path: 'screenshots/arcade-desktop-light-language-menu-1440x900.png',
              fullPage: false,
            })
            await lightPage.locator('.website-language-trigger').click()

            await lightPage.getByRole('button', { name: /Facilitator/i }).click()
            await lightPage.locator('.facilitator-drawer').waitFor()
            await lightPage.screenshot({
              path: 'screenshots/arcade-desktop-light-facilitator-1440x900.png',
              fullPage: false,
            })
            await lightPage.close()

            const preferencePage = await browser.newPage({
              viewport: { width: 390, height: 844 },
            })
            await preferencePage.goto('http://127.0.0.1:3000', {
              waitUntil: 'networkidle',
            })
            await preferencePage.evaluate(() => {
              window.localStorage.setItem('arcade-points-locale', 'vi')
            })
            await preferencePage.reload({ waitUntil: 'networkidle' })
            await preferencePage.locator('html[data-locale="vi"]').waitFor()
            const persistedLocale = await preferencePage
              .locator('.website-language-current-code')
              .innerText()
            if (persistedLocale.trim() !== 'VI') {
              throw new Error(`Stored homepage locale was ignored: ${persistedLocale}`)
            }
            await preferencePage.close()

            const lightMobilePage = await browser.newPage({
              viewport: { width: 390, height: 844 },
            })
            await lightMobilePage.addInitScript(() => {
              window.localStorage.setItem('arcade-theme', 'light')
            })
            await lightMobilePage.goto('http://127.0.0.1:3000', {
              waitUntil: 'networkidle',
            })
            await lightMobilePage.locator('html.light').waitFor()
            await lightMobilePage.getByRole('button', { name: 'Analyze profile' }).waitFor()
            await lightMobilePage.locator('.website-language-trigger').click()
            await lightMobilePage.locator('.website-language-menu').waitFor()
            await lightMobilePage.screenshot({
              path: 'screenshots/arcade-mobile-light-language-menu-390x844.png',
              fullPage: false,
            })
            await lightMobilePage.locator('.website-language-trigger').click()
            await lightMobilePage.screenshot({
              path: 'screenshots/arcade-mobile-light-390x844.png',
              fullPage: false,
            })
            await lightMobilePage.close()

            await page.setViewportSize({ width: 390, height: 844 })
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' })
            await page.getByRole('button', { name: 'Analyze profile' }).waitFor()
            await page.screenshot({
              path: 'screenshots/arcade-mobile-empty-390x844.png',
              fullPage: false,
            })

            await page.locator('.website-language-trigger').click()
            await page
              .locator('.website-language-option')
              .filter({ hasText: 'Tiếng Việt' })
              .click()
            await page.waitForURL((url) => /\/vi\/?$/.test(url.pathname))
            await page.locator('html[lang="vi"][dir="ltr"][data-locale="vi"]').waitFor()
            await page.getByRole('button', { name: 'Phân tích hồ sơ' }).waitFor()

            const vietnameseResponse = await page.request.get(
              'http://127.0.0.1:3000/vi/',
            )
            const vietnameseHtml = await vietnameseResponse.text()
            const vietnameseHtmlTag = vietnameseHtml.match(/<html\b[^>]*>/i)?.[0] ?? ''
            if (
              !vietnameseHtmlTag.includes('lang="vi"') ||
              !vietnameseHtmlTag.includes('dir="ltr"') ||
              !vietnameseHtmlTag.includes('data-locale="vi"')
            ) {
              throw new Error(
                `Vietnamese HTML lacks server-rendered locale attributes: ${vietnameseHtmlTag}`,
              )
            }

            const arabicResponse = await page.request.get(
              'http://127.0.0.1:3000/ar/',
            )
            const arabicHtml = await arabicResponse.text()
            const arabicHtmlTag = arabicHtml.match(/<html\b[^>]*>/i)?.[0] ?? ''
            if (
              !arabicHtmlTag.includes('lang="ar"') ||
              !arabicHtmlTag.includes('dir="rtl"') ||
              !arabicHtmlTag.includes('data-locale="ar"')
            ) {
              throw new Error(
                `Arabic HTML lacks server-rendered locale attributes: ${arabicHtmlTag}`,
              )
            }

            const canonical = await page.locator('link[rel="canonical"]').getAttribute('href')
            if (canonical !== 'https://arcade.eplus.dev/vi/') {
              throw new Error(`Unexpected Vietnamese canonical URL: ${canonical}`)
            }

            const vietnameseAlternate = await page
              .locator('link[rel="alternate"][hreflang="vi"]')
              .getAttribute('href')
            if (vietnameseAlternate !== 'https://arcade.eplus.dev/vi/') {
              throw new Error(`Unexpected Vietnamese hreflang URL: ${vietnameseAlternate}`)
            }

            const heroHeading = page.locator('.hero-heading h1')
            const translatedHeading = await heroHeading.innerText()
            if (!translatedHeading.includes('KIỂM TRA')) {
              throw new Error(`Vietnamese heading was not applied: ${translatedHeading}`)
            }

            const headingFont = await heroHeading.evaluate(
              (element) => window.getComputedStyle(element).fontFamily,
            )
            if (headingFont.includes('Press Start 2P')) {
              throw new Error(`Vietnamese heading still uses unsupported pixel font: ${headingFont}`)
            }

            await page.screenshot({
              path: 'screenshots/arcade-mobile-vi-390x844.png',
              fullPage: false,
            })

            await browser.close()
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: arcade-visual-preview
          path: screenshots/*.png
          retention-days: 14
