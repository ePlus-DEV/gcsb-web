name: Apply live slot UI update

on:
  push:
    branches:
      - feat/arcade-dashboard-redesign
    paths:
      - scripts/apply-live-slot-ui.mjs
      - .github/workflows/apply-live-slot-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/arcade-dashboard-redesign
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Apply live slot data UI
        run: node scripts/apply-live-slot-ui.mjs

      - name: Remove one-time patch files
        run: |
          rm -f scripts/apply-live-slot-ui.mjs
          rm -f .github/workflows/apply-live-slot-ui.yml

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build static site
        run: yarn build

      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/redesign-calculator.tsx app/styles/redesign-results.css app/styles/redesign-components.css scripts/apply-live-slot-ui.mjs .github/workflows/apply-live-slot-ui.yml
          git commit -m "fix: load live Arcade slot availability"
          git push origin HEAD:feat/arcade-dashboard-redesign
