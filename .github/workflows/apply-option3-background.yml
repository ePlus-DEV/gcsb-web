name: Apply Option 3 background hero

on:
  push:
    branches:
      - fix/manual-entry-overlap
    paths:
      - .github/workflows/apply-option3-background.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/manual-entry-overlap

      - name: Integrate Option 3 hero
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/calculator-client.tsx')
          text = path.read_text(encoding='utf-8')

          visual_import = '''import {
            ExtensionStoreLinks,
            JoystickLogo,
            TrailMap,
            TrailStats,
          } from "@/components/arcade/visuals"
          '''
          option_import = visual_import + 'import { Option3Hero } from "@/components/arcade/option3-hero"\n'
          if 'Option3Hero' not in text:
              if visual_import not in text:
                  raise SystemExit('Could not find visuals import block')
              text = text.replace(visual_import, option_import, 1)

          marker = '''    <main className="arcade-page">
                <header className="site-header" ref={headerRef}>'''
          replacement = '''    <main className="arcade-page">
                <Option3Hero
                  profileUrl={profileUrl}
                  setProfileUrl={setProfileUrl}
                  analyzeProfile={analyzeProfile}
                  loading={loading}
                  error={error}
                  manualMode={manualMode}
                  setManualMode={setManualMode}
                  snapshot={snapshot}
                  updateManual={updateManual}
                  nextTier={nextTier}
                  pointsRemaining={pointsRemaining}
                  hasResult={hasResult}
                  resetCalculator={resetCalculator}
                />
                <header className="site-header" ref={headerRef}>'''

          if '<Option3Hero' not in text:
              if marker not in text:
                  raise SystemExit('Could not find main/header insertion point')
              text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Validate
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn typecheck
          yarn lint
          yarn build

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-option3-background.yml
          git add app/calculator-client.tsx
          git commit -m "feat: use exact Option 3 artwork for the desktop hero"
          git push origin HEAD:fix/manual-entry-overlap
