name: Deploy production to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gcsb-pages-content
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build production static export
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
          NEXT_PUBLIC_GA_IDS: "G-SJNYKL2864,G-41VM0C9NGM"
        run: yarn build

      - name: Verify production asset paths and analytics
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          grep -q 'src="/_next/' out/index.html
          python3 - <<'PY'
          from pathlib import Path

          html = Path("out/index.html").read_text()
          primary_url = "https://www.googletagmanager.com/gtag/js?id=G-SJNYKL2864"

          if html.count(f'src="{primary_url}"') != 1:
              raise SystemExit("Expected exactly one primary gtag.js script URL.")

          for ga_id in ("G-SJNYKL2864", "G-41VM0C9NGM"):
              if html.count(f'gtag("config", "{ga_id}");') != 1:
                  raise SystemExit(f"Expected exactly one gtag config for {ga_id}.")
          PY
          if grep -q '/gcsb-web/_next/' out/index.html; then
            echo "Production still contains the repository-name base path."
            exit 1
          fi

      - name: Preserve open PR previews
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published-site

          if git ls-remote --exit-code --heads \
            "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://github.com/${GITHUB_REPOSITORY}.git" published-site
            rm -rf published-site/.git
          else
            mkdir -p published-site
          fi

          mkdir -p published-site/pr-preview
          find published-site -mindepth 1 -maxdepth 1 \
            ! -name pr-preview -exec rm -rf {} +
          cp -a out/. published-site/
          touch published-site/.nojekyll

      - name: Save complete Pages content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd published-site
          git init
          git checkout -B gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: production ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
