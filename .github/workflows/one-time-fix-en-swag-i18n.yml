name: One-time fix English swag i18n templates

on:
  push:
    branches:
      - fix/swag-i18n

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/swag-i18n
          fetch-depth: 0

      - name: Add English dynamic swag templates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'public/i18n/locales/en.json'
          const data = JSON.parse(fs.readFileSync(file, 'utf8'))
          data.additional ||= {}
          Object.assign(data.additional, {
            '__swag:knownNow': '{known} known now · ≈{unrevealed} still unrevealed',
            '__swag:revealedPending': '{revealed} revealed · {pending} pending',
            '__swag:totalPrizeSlots': '{count} total prize slots',
            '__swag:percentLeft': '{percent}% left',
            '__swag:baseline': '2025 baseline: {count}',
            '__swag:projectedItems': '≈{count} projected items',
          })
          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`)
          NODE

      - name: Commit source-catalog fix
        shell: bash
        run: |
          rm .github/workflows/one-time-fix-en-swag-i18n.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete English swag i18n templates"
          git push origin HEAD:fix/swag-i18n
