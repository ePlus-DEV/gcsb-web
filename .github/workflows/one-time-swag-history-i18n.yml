name: One-time swag history i18n

on:
  push:
    branches: [feature/swag-2025-history]
    paths: [.github/workflows/one-time-swag-history-i18n.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/swag-2025-history
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update locale catalogs
        run: python scripts/one-time-swag-history-i18n.py
      - name: Commit locale changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/i18n/locales/*.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: translate 2025 swag history"
          git push
