name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Apply open PR review fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/arcade-dashboard-redesign'
        run: node scripts/fix-pr9-open-review-findings.mjs

      - name: Restore normal CI and remove temporary patch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/arcade-dashboard-redesign'
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches: ["main"]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    persist-credentials: false

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: "20"
                    cache: yarn

                - name: Install dependencies
                  run: yarn install --frozen-lockfile --non-interactive

                - name: Type check
                  run: yarn typecheck

                - name: Lint
                  run: yarn lint

                - name: Build static site
                  run: yarn build
          YAML
          rm -f scripts/fix-pr9-open-review-findings.mjs

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build static site
        run: yarn build

      - name: Commit verified fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/arcade-dashboard-redesign'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve remaining PR review findings"
          git push origin "HEAD:${BRANCH_NAME}"
