name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: feat/arcade-dashboard-redesign
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Apply Chrome and Firefox store CTAs
        run: |
          sed -i 's/|EXTENSION_URL//' scripts/apply-extension-store-cta.mjs
          node scripts/apply-extension-store-cta.mjs

      - name: Restore normal CI and remove migration script
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches: ["main"]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    persist-credentials: false

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: "20"
                    cache: yarn

                - name: Install dependencies
                  run: yarn install --frozen-lockfile --non-interactive

                - name: Type check
                  run: yarn typecheck

                - name: Lint
                  run: yarn lint

                - name: Build static site
                  run: yarn build
          YAML
          rm -f scripts/apply-extension-store-cta.mjs

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build static site
        run: yarn build

      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: promote Chrome and Firefox extension installs"
          git push origin HEAD:feat/arcade-dashboard-redesign
