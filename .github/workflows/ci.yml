name: CI

on:
  pull_request:
  push:
    branches: ["main", "fix/manual-entry-overlap"]

permissions:
  contents: read

jobs:
  apply-arcade-tiers:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/manual-entry-overlap'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/manual-entry-overlap

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Apply migration script
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-arcade-2026-tiers.yml').read_text(encoding='utf-8')
          marker = "python <<'PY'\n"
          script = workflow.split(marker, 1)[1].rsplit('\n          PY\n', 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )

          calculator_block = r'''
          import re

          client = Path('app/calculator-client.tsx')
          text = client.read_text(encoding='utf-8')

          def replace_required(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Missing calculator text: {old[:120]!r}')
              text = text.replace(old, new, 1)

          def sub_required(pattern: str, replacement: str, flags: int = 0) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Calculator regex matched {count} times: {pattern[:120]!r}')

          old_import = "\n".join([
              "  API_URL,",
              "  DEMO_SNAPSHOT,",
              "  PROFILE_URL_PATTERN,",
              "  SAMPLE_BADGES,",
              "  STORAGE_KEY,",
              "  formatNumber,",
              "  getNextTier,",
              "  getTier,",
              "  numeric,",
              "  clamp,",
          ])
          new_import = "\n".join([
              "  API_URL,",
              "  ARCADE_MILESTONES_URL,",
              "  EMPTY_SNAPSHOT,",
              "  LEGACY_STORAGE_KEY,",
              "  OFFICIAL_MILESTONES,",
              "  PROFILE_URL_PATTERN,",
              "  STORAGE_KEY,",
              "  clamp,",
              "  formatInteger,",
              "  formatNumber,",
              "  getNextTier,",
              "  getTier,",
              "  numeric,",
              "  tierRangeLabel,",
          ])
          replace_required(old_import, new_import)
          replace_required(
              "  ArcadeApiResponse,\n  ArcadeBadge,\n  BadgeFilter,\n  CalculatorSnapshot,",
              "  ArcadeApiResponse,\n  ArcadeBadge,\n  ArcadeMilestone,\n  BadgeFilter,\n  CalculatorSnapshot,",
          )

          for old, new in [
              ("DEMO_SNAPSHOT.targetPoints", "EMPTY_SNAPSHOT.targetPoints"),
              ("DEMO_SNAPSHOT.userName", "EMPTY_SNAPSHOT.userName"),
              ("DEMO_SNAPSHOT.milestone", "EMPTY_SNAPSHOT.milestone"),
              ("DEMO_SNAPSHOT.scoreComplete", "EMPTY_SNAPSHOT.scoreComplete"),
              ("useState<CalculatorSnapshot>(DEMO_SNAPSHOT)", "useState<CalculatorSnapshot>(EMPTY_SNAPSHOT)"),
              ("useState<ArcadeBadge[]>(SAMPLE_BADGES)", "useState<ArcadeBadge[]>([])"),
          ]:
              replace_required(old, new)

          replace_required(
              "  const [isDemo, setIsDemo] = useState(true)",
              "\n".join([
                  "  const [hasResult, setHasResult] = useState(false)",
                  "  const [milestones, setMilestones] = useState<ArcadeMilestone[]>(OFFICIAL_MILESTONES)",
                  "  const [milestonesLive, setMilestonesLive] = useState(false)",
              ]),
          )
          replace_required(
              "  useEffect(() => {\n    const stored = readStorage(STORAGE_KEY)",
              "  useEffect(() => {\n    removeStorage(LEGACY_STORAGE_KEY)\n    const stored = readStorage(STORAGE_KEY)",
          )
          text = text.replace("setIsDemo(false)", "setHasResult(true)")

          persistence_and_slots = "\n".join([
              "  useEffect(() => {",
              "    if (!hasResult) return",
              "",
              "    const timeoutId = window.setTimeout(",
              "      () => persistCalculatorState(snapshot, response, badges),",
              "      STORAGE_DEBOUNCE_MS,",
              "    )",
              "",
              "    return () => window.clearTimeout(timeoutId)",
              "  }, [badges, hasResult, response, snapshot])",
              "",
              "  useEffect(() => {",
              "    let active = true",
              "",
              "    async function loadMilestones() {",
              "      try {",
              "        const request = await fetch(ARCADE_MILESTONES_URL, { cache: \"no-store\" })",
              "        if (!request.ok) return",
              "",
              "        const payload: unknown = await request.json()",
              "        if (!Array.isArray(payload)) return",
              "",
              "        const liveMilestones = OFFICIAL_MILESTONES.map((fallback) => {",
              "          const candidate = payload.find(",
              "            (item) =>",
              "              typeof item === \"object\" &&",
              "              item !== null &&",
              "              numeric((item as { points?: unknown }).points) === fallback.points,",
              "          ) as Record<string, unknown> | undefined",
              "",
              "          if (!candidate) return fallback",
              "",
              "          const slots = numeric(candidate.slots)",
              "          const spotsLeft = numeric(candidate.spotsLeft)",
              "          if (slots <= 0 || spotsLeft < 0 || spotsLeft > slots) return fallback",
              "",
              "          return {",
              "            ...fallback,",
              "            league:",
              "              typeof candidate.league === \"string\" ? candidate.league : fallback.league,",
              "            slots,",
              "            spotsLeft,",
              "          }",
              "        })",
              "",
              "        if (active) {",
              "          setMilestones(liveMilestones)",
              "          setMilestonesLive(true)",
              "        }",
              "      } catch {",
              "        // Keep verified total slots if live crawler data is temporarily unavailable.",
              "      }",
              "    }",
              "",
              "    void loadMilestones()",
              "    return () => {",
              "      active = false",
              "    }",
              "  }, [])",
          ])
          sub_required(
              r"  useEffect\(\(\) => \{\n    if \(isDemo\) return\n.*?\n  \}, \[badges, isDemo, response, snapshot\]\)",
              persistence_and_slots,
              re.S,
          )

          next_tier_block = "\n".join([
              "  const nextTier = useMemo(",
              "    () => getNextTier(snapshot.currentPoints),",
              "    [snapshot.currentPoints],",
              "  )",
              "  const nextMilestone =",
              "    milestones.find((milestone) => milestone.points === nextTier.points) ??",
              "    milestones[milestones.length - 1]",
          ])
          sub_required(
              r"  const nextTier = useMemo\(\n    \(\) => getNextTier\(snapshot\.currentPoints, snapshot\.targetPoints\),\n    \[snapshot\.currentPoints, snapshot\.targetPoints\],\n  \)",
              next_tier_block,
          )

          text = text.replace("    const officialNext = getNextTier(totalPoints, 50)\n", "")
          replace_required("      targetPoints: officialNext.points,", "      targetPoints: 120,")

          reset_block = "\n".join([
              "  function resetCalculator() {",
              "    setSnapshot(EMPTY_SNAPSHOT)",
              "    setProfileUrl(\"\")",
              "    setResponse(null)",
              "    setBadges([])",
              "    setError(\"\")",
              "    setManualMode(false)",
              "    setHasResult(false)",
              "    removeStorage(STORAGE_KEY)",
              "    removeStorage(LEGACY_STORAGE_KEY)",
              "  }",
          ])
          sub_required(r"  function loadDemo\(\) \{\n.*?\n  \}", reset_block, re.S)

          text = re.sub(
              r'\n\s*<button className="secondary-button" type="button" onClick=\{loadDemo\}><Gamepad2 /> Try demo</button>',
              "",
              text,
              count=1,
          )
          text = re.sub(
              r'\n\s*<label>Target<select.*?</select></label>',
              "",
              text,
              count=1,
          )

          next_card = "\n".join([
              "        <aside className=\"next-tier-card\" aria-label=\"Next Arcade tier\">",
              "          <span>{snapshot.currentPoints >= 120 ? \"Top tier\" : \"Next tier\"}</span>",
              "          <strong>{nextTier.league}</strong>",
              "          <b>{nextTier.points === 120 ? \"120+ points\" : `${nextTier.points} points`}</b>",
              "          <p>{pointsRemaining > 0 ? `${formatNumber(pointsRemaining)} points remaining` : \"Top 2026 tier reached\"}</p>",
              "          {nextMilestone && (",
              "            <p className=\"slot-summary\">",
              "              {nextMilestone.spotsLeft === null",
              "                ? `${formatInteger(nextMilestone.slots)} total slots`",
              "                : `${formatInteger(nextMilestone.spotsLeft)} of ${formatInteger(nextMilestone.slots)} slots left`}",
              "            </p>",
              "          )}",
              "          <div className=\"mini-progress\" role=\"progressbar\" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(completion)} aria-label=\"Progress to next tier\"><span style={{ width: `${completion}%` }} /></div>",
              "        </aside>",
          ])
          sub_required(
              r'        <aside className="next-tier-card" aria-label="Next Arcade tier">\n.*?\n        </aside>',
              next_card,
              re.S,
          )

          status_block = "\n".join([
              "        <div className=\"stage-status\">",
              "          <span className={hasResult ? \"status-dot\" : \"status-dot idle\"} />",
              "          {hasResult",
              "            ? `Showing ${snapshot.userName || \"manual entry\"}'s latest saved result`",
              "            : \"No demo data — analyze a public profile or use manual entry\"}",
              "          {hasResult && <button type=\"button\" onClick={resetCalculator}><RotateCcw /> Reset</button>}",
              "        </div>",
          ])
          sub_required(r'        <div className="stage-status">\n.*?\n        </div>', status_block, re.S)

          insight_old = "\n".join([
              "        <div><small>Current tier</small><strong>{currentTier.name}</strong></div>",
              "        <div><small>Next goal</small><strong>{formatNumber(pointsRemaining)} points away</strong></div>",
              "        <div><small>Estimated work</small><strong>About {estimatedActivities} more 1-point activities</strong></div>",
              "        <div><small>Score confidence</small><strong>{snapshot.scoreComplete ? \"All eligible badges classified\" : `${snapshot.unknownBadgeCount} badge(s) need review`}</strong></div>",
          ])
          insight_new = "\n".join([
              "        <div><small>Current tier</small><strong>{hasResult ? currentTier.name : \"Awaiting profile\"}</strong></div>",
              "        <div><small>Next goal</small><strong>{hasResult ? `${formatNumber(pointsRemaining)} points away` : \"Trooper starts at 50\"}</strong></div>",
              "        <div><small>Estimated work</small><strong>{hasResult ? `About ${estimatedActivities} more 1-point activities` : \"Analyze a profile first\"}</strong></div>",
              "        <div><small>Score confidence</small><strong>{hasResult ? (snapshot.scoreComplete ? \"All eligible badges classified\" : `${snapshot.unknownBadgeCount} badge(s) need review`) : \"No result loaded\"}</strong></div>",
          ])
          replace_required(insight_old, insight_new)
          replace_required(
              "<strong>{formatNumber(snapshot.currentPoints)}</strong><small>Synced while you learn</small>",
              "<strong>{hasResult ? formatNumber(snapshot.currentPoints) : \"—\"}</strong><small>Synced while you learn</small>",
          )

          tier_section = "\n".join([
              "",
              "      <section className=\"content-section tier-section\" aria-labelledby=\"tier-heading\">",
              "        <div className=\"section-heading\">",
              "          <div>",
              "            <p className=\"eyebrow\"><Trophy /> Arcade 2026 tiers</p>",
              "            <h2 id=\"tier-heading\">Every official milestone and prize slot.</h2>",
              "            <p>The point ranges and total slots are fixed for the 2026 season. Remaining slots are loaded from the automated arcade-crawler repository.</p>",
              "          </div>",
              "          <p className={milestonesLive ? \"tier-data-source is-live\" : \"tier-data-source\"}>",
              "            {milestonesLive ? \"Live crawler data\" : \"Live availability unavailable\"}",
              "          </p>",
              "        </div>",
              "        <div className=\"tier-grid\">",
              "          {[...milestones].reverse().map((milestone) => (",
              "            <article className=\"tier-card\" key={milestone.points}>",
              "              <small>{milestone.league.replace(\"Arcade \", \"\")}</small>",
              "              <strong>{tierRangeLabel(milestone)}</strong>",
              "              <span>{formatInteger(milestone.slots)} slots</span>",
              "              <b>",
              "                {milestone.spotsLeft === null",
              "                  ? \"Remaining slots unavailable\"",
              "                  : `${formatInteger(milestone.spotsLeft)} spots left`}",
              "              </b>",
              "            </article>",
              "          ))}",
              "        </div>",
              "      </section>",
          ])
          marker = '      </section>\n\n      <section id="badges" className="content-section badge-section">'
          replace_required(
              marker,
              '      </section>' + tier_section + '\n\n      <section id="badges" className="content-section badge-section">',
          )

          for forbidden in ["DEMO_SNAPSHOT", "SAMPLE_BADGES", "isDemo", "loadDemo", "Try demo"]:
              if forbidden in text:
                  raise SystemExit(f'Demo code remains in calculator: {forbidden}')

          client.write_text(text, encoding='utf-8')
          '''

          start = script.index("client = Path('app/calculator-client.tsx')")
          end = script.index("# Layout and tier cards.")
          script = script[:start] + calculator_block.strip() + "\n\n" + script[end:]
          exec(compile(script, 'apply-arcade-2026-tiers.py', 'exec'))
          PY

      - name: Validate migrated site
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn typecheck
          yarn lint
          yarn build

      - name: Commit migrated source and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/apply-arcade-2026-tiers.yml
          git add app components .github/workflows/ci.yml
          git commit -m "feat: use live Arcade 2026 tiers and remove demo data"
          git push origin HEAD:fix/manual-entry-overlap

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build static site
        run: yarn build
