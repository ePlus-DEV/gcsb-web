name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Unit tests
        run: yarn test:unit

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build production static site
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
          NEXT_PUBLIC_GA_ID: "G-SJNYKL2864"
        run: yarn build

      - name: Verify prerendered SEO HTML
        run: node scripts/verify-seo-export.mjs

      - name: Verify seasonal UI in a browser
        run: |
          yarn playwright install --with-deps chromium
          node scripts/verify-halloween-ui.mjs
          node scripts/verify-guest-discovery.mjs

      - name: Validate approved Home design and capture PC/mobile screenshots
        run: node scripts/verify-landing-reference.mjs

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-home-pc-mobile
          path: artifacts/landing-reference/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify default Google Analytics and cookie notice
        run: |
          node scripts/verify-google-analytics-html.mjs \
            out/index.html \
            G-SJNYKL2864
