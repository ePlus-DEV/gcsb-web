name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Unit tests
        run: yarn test:unit

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build production static site
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
          NEXT_PUBLIC_GA_ID: "G-SJNYKL2864"
        run: yarn build

      - name: Verify prerendered SEO HTML
        run: node scripts/verify-seo-export.mjs

      - name: Verify seasonal UI in a browser
        run: |
          yarn playwright install --with-deps chromium
          node scripts/verify-halloween-ui.mjs
          node scripts/verify-guest-discovery.mjs

      - name: Validate approved Home design and capture PC/mobile screenshots
        run: node scripts/verify-landing-reference.mjs

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-home-pc-mobile
          path: artifacts/landing-reference/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify default Google Analytics and cookie notice
        run: |
          node scripts/verify-google-analytics-html.mjs \
            out/index.html \
            G-SJNYKL2864



  capture-dark-hero:
    name: Capture matching dark Dashboard Hero once
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch for snapshot commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Check for existing dark Dashboard snapshots
        id: check
        run: |
          if [ -s public/images/dashboard-hero-en-dark.png ] && [ -s public/images/dashboard-hero-vi-dark.png ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build real Dashboard
        if: steps.check.outputs.exists == 'false'
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
        run: yarn build
      - name: Capture synthetic profile on actual dark Dashboard
        if: steps.check.outputs.exists == 'false'
        run: |
          yarn playwright install --with-deps chromium
          node scripts/capture-dashboard-hero.mjs public/images dark
      - name: Commit assets to Draft PR branch only
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/dashboard-hero-en-dark.png public/images/dashboard-hero-vi-dark.png
          git diff --cached --quiet && exit 0
          git commit -m "assets(home): capture real Dashboard in dark theme"
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git rebase "origin/${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
