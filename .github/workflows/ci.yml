name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Enforce new design colors
        env:
          DESIGN_COLOR_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: node scripts/design-color-guard.mjs --base "$DESIGN_COLOR_BASE"

      - name: Unit tests
        run: yarn test:unit

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build production static site
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
          NEXT_PUBLIC_GA_ID: "G-SJNYKL2864"
        run: yarn build

      - name: Verify prerendered SEO HTML
        run: node scripts/verify-seo-export.mjs

      - name: Verify seasonal UI in a browser
        run: |
          yarn playwright install --with-deps chromium
          node scripts/verify-halloween-ui.mjs
          node scripts/verify-guest-discovery.mjs
          node scripts/verify-swag-theme.mjs

      - name: Verify default Google Analytics and cookie notice
        run: |
          node scripts/verify-google-analytics-html.mjs \
            out/index.html \
            G-SJNYKL2864
