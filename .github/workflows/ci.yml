name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Apply pending review fixes
        run: python scripts/apply-review-fixes.py

      - name: Restore normal CI workflow
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches: ["main"]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    persist-credentials: false

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: "20"
                    cache: yarn

                - name: Install dependencies
                  run: yarn install --frozen-lockfile --non-interactive

                - name: Type check
                  run: yarn typecheck

                - name: Lint
                  run: yarn lint

                - name: Build static site
                  run: yarn build
          YAML
          rm -f scripts/apply-review-fixes.py

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build static site
        run: yarn build

      - name: Commit verified fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address PR review findings"
          git push origin "HEAD:${HEAD_REF}"
