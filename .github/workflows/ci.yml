name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build production static site
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
          NEXT_PUBLIC_GA_IDS: "G-SJNYKL2864,G-41VM0C9NGM"
        run: yarn build

      - name: Verify Google Analytics initialization
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          python3 - <<'PY'
          from pathlib import Path

          html = Path("out/index.html").read_text()
          primary_url = "https://www.googletagmanager.com/gtag/js?id=G-SJNYKL2864"

          if html.count(f'src="{primary_url}"') != 1:
              raise SystemExit("Expected exactly one primary gtag.js script URL.")

          for ga_id in ("G-SJNYKL2864", "G-41VM0C9NGM"):
              if html.count(f'gtag("config", "{ga_id}");') != 1:
                  raise SystemExit(f"Expected exactly one gtag config for {ga_id}.")
          PY
