name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  remediate-pr-3:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/manual-entry-overlap'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/manual-entry-overlap

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Apply review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing expected text in {path}: {old[:140]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Bound and cancel the live milestone request.
          replace_once(
              "app/calculator-client.tsx",
              """  useEffect(() => {\n    let active = true\n\n    async function loadMilestones() {""",
              """  useEffect(() => {\n    let active = true\n    const controller = new AbortController()\n    const timeoutId = window.setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS)\n\n    async function loadMilestones() {""",
          )
          replace_once(
              "app/calculator-client.tsx",
              """        const request = await fetch(ARCADE_MILESTONES_URL, { cache: \"no-store\" })""",
              """        const request = await fetch(ARCADE_MILESTONES_URL, {\n          cache: \"no-store\",\n          signal: controller.signal,\n        })""",
          )
          replace_once(
              "app/calculator-client.tsx",
              """      } catch {\n        // Keep verified total slots if live crawler data is temporarily unavailable.\n      }\n    }\n\n    void loadMilestones()\n    return () => {\n      active = false\n    }\n  }, [])""",
              """      } catch {\n        // Keep verified total slots if live crawler data is temporarily unavailable.\n      } finally {\n        window.clearTimeout(timeoutId)\n      }\n    }\n\n    void loadMilestones()\n    return () => {\n      active = false\n      window.clearTimeout(timeoutId)\n      controller.abort()\n    }\n  }, [])""",
          )

          # Keep navigation labels in semantic JSX rather than generated CSS content.
          replace_once(
              "app/calculator-client.tsx",
              """          <a className=\"active\" href=\"#calculator\" onClick={closeMobileNavigation}><Trophy />Calculator</a>\n          <a href=\"#badges\" onClick={closeMobileNavigation}><BadgeCheck />Badges</a>\n          <a href=\"#extension\" onClick={closeMobileNavigation}><ShieldCheck />Extension</a>\n          <a href=\"https://github.com/ePlus-DEV/google-cloud-skills-boost-helper\" target=\"_blank\" rel=\"noreferrer\" onClick={closeMobileNavigation}><Github />GitHub</a>""",
              """          <a className=\"active\" href=\"#calculator-option3\" onClick={closeMobileNavigation}><Trophy />Dashboard</a>\n          <a href=\"#calculator\" onClick={closeMobileNavigation}><BadgeCheck />Calculator</a>\n          <a href=\"#badges\" onClick={closeMobileNavigation}><ShieldCheck />Badge Tracker</a>\n          <a href=\"#extension\" onClick={closeMobileNavigation}><Github />Resources</a>""",
          )
          replace_once(
              "app/styles/base.css",
              """  font-size: 0;\n  font-weight: 700;\n  border-bottom: 4px solid transparent;\n}\n\n.site-nav a::after {\n  font-size: 1.03rem;\n}\n\n.site-nav a:nth-child(1)::after { content: \"Dashboard\"; }\n.site-nav a:nth-child(2)::after { content: \"Calculator\"; }\n.site-nav a:nth-child(3)::after { content: \"Badge Tracker\"; }\n.site-nav a:nth-child(4)::after { content: \"Resources\"; }""",
              """  font-size: 1.03rem;\n  font-weight: 700;\n  border-bottom: 4px solid transparent;\n}""",
          )

          # Modern visually-hidden pattern.
          replace_once(
              "app/styles/trail.css",
              "clip: rect(0 0 0 0);",
              "clip-path: inset(50%);",
          )

          # The explicit class is synchronized in React; remove :has() selector-list
          # members so older browsers cannot invalidate the fallback rule.
          for css_path in ("app/styles/trail.css", "app/styles/responsive.css"):
              file = Path(css_path)
              text = file.read_text(encoding="utf-8")
              text, count = re.subn(
                  r"(?m)^(\s*\.trail-stage\.is-manual-open[^\n]*),\n\s*\.trail-stage:has\(\.manual-panel\)[^\n]*\s*\{",
                  r"\1 {",
                  text,
              )
              if count == 0:
                  raise SystemExit(f"No combined :has() selectors found in {css_path}")
              if ":has(.manual-panel)" in text:
                  raise SystemExit(f"Unsupported :has() manual selector remains in {css_path}")
              file.write_text(text, encoding="utf-8")

          # Make the coded trail use exact checkpoint coordinates at official tiers.
          replace_once(
              "components/arcade/visuals.tsx",
              """  BookOpen,\n  Chrome,""",
              """  BookOpen,\n  CircleHelp,\n  Chrome,""",
          )
          visuals = Path("components/arcade/visuals.tsx")
          text = visuals.read_text(encoding="utf-8")
          text, removed = re.subn(
              r"const TRAIL_POINTS = \[.*?\n\]\n\n",
              "",
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit("Could not remove obsolete TRAIL_POINTS")
          visuals.write_text(text, encoding="utf-8")
          replace_once(
              "components/arcade/visuals.tsx",
              """function pointOnTrail(progress: number) {\n  const safeProgress = Number.isFinite(progress) ? clamp(progress, 0, 1) : 0\n  const scaled = safeProgress * (TRAIL_POINTS.length - 1)\n  const index = Math.min(Math.floor(scaled), TRAIL_POINTS.length - 2)\n  const localProgress = scaled - index\n  const start = TRAIL_POINTS[index]\n  const end = TRAIL_POINTS[index + 1]\n\n  return {\n    x: start.x + (end.x - start.x) * localProgress,\n    y: start.y + (end.y - start.y) * localProgress,\n  }\n}""",
              """function pointOnTrail(points: number) {\n  const safePoints = Number.isFinite(points) ? clamp(points, 0, 120) : 0\n  const endIndex = CHECKPOINTS.findIndex((checkpoint) => safePoints <= checkpoint.label)\n\n  if (endIndex <= 0) {\n    return { x: CHECKPOINTS[0].x, y: CHECKPOINTS[0].y }\n  }\n\n  const start = CHECKPOINTS[endIndex - 1]\n  const end = CHECKPOINTS[endIndex]\n  const segmentLength = end.label - start.label\n  const localProgress = segmentLength > 0 ? (safePoints - start.label) / segmentLength : 0\n\n  return {\n    x: start.x + (end.x - start.x) * localProgress,\n    y: start.y + (end.y - start.y) * localProgress,\n  }\n}""",
          )
          replace_once(
              "components/arcade/visuals.tsx",
              "const pin = pointOnTrail(progress)",
              "const pin = pointOnTrail(currentPoints)",
          )

          # Preserve and render trivia-badge data in the coded responsive view.
          replace_once(
              "components/arcade/visuals.tsx",
              "tone: \"lime\" | \"coral\" | \"mint\"",
              "tone: \"lime\" | \"coral\" | \"purple\" | \"mint\"",
          )
          replace_once(
              "components/arcade/visuals.tsx",
              """      <StatCard icon={<Gamepad2 />} value={String(snapshot.gameBadges)} label=\"game badges\" tone=\"coral\" />\n      <StatCard icon={<BookOpen />} value={String(snapshot.skillBadges)} label=\"skill badges\" tone=\"mint\" />""",
              """      <StatCard icon={<Gamepad2 />} value={String(snapshot.gameBadges)} label=\"game badges\" tone=\"coral\" />\n      <StatCard icon={<CircleHelp />} value={String(snapshot.triviaBadges)} label=\"trivia badges\" tone=\"purple\" />\n      <StatCard icon={<BookOpen />} value={String(snapshot.skillBadges)} label=\"skill badges\" tone=\"mint\" />""",
          )
          replace_once(
              "app/styles/trail.css",
              """  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 18px;\n  width: min(640px, 47%);""",
              """  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 14px;\n  width: min(820px, 59%);""",
          )
          replace_once(
              "app/styles/trail.css",
              ".stat-icon--coral { background: #ff8a7e; }\n.stat-icon--mint",
              ".stat-icon--coral { background: #ff8a7e; }\n.stat-icon--purple { background: #d9d1ff; }\n.stat-icon--mint",
          )
          replace_once(
              "app/styles/responsive.css",
              """  .trail-stats {\n    width: calc(100% - 40px);\n    right: 20px;\n    bottom: 25px;\n  }""",
              """  .trail-stats {\n    width: calc(100% - 40px);\n    right: 20px;\n    bottom: 25px;\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }""",
          )

          # Public asset URLs must be rooted for nested routes.
          replace_once(
              "components/arcade/option3-hero.tsx",
              'src="design/option3-background.avif"',
              'src="/design/option3-background.avif"',
          )

          # Use dependencies committed in the Yarn lockfile for visual checks.
          replace_once(
              ".github/workflows/visual-preview.yml",
              """      - name: Install Playwright runtime\n        run: npm install --no-save --ignore-scripts --legacy-peer-deps playwright@1.55.0\n\n      - name: Install Chromium\n        run: npx playwright install --with-deps chromium""",
              """      - name: Install Chromium\n        run: yarn playwright install --with-deps chromium""",
          )
          replace_once(
              ".github/workflows/visual-preview.yml",
              "npx --yes wait-on@8 http://127.0.0.1:3000",
              "yarn wait-on http://127.0.0.1:3000",
          )

          # Restore the normal CI workflow in the resulting commit.
          Path(".github/workflows/ci.yml").write_text(
              '''name: CI\n\non:\n  pull_request:\n  push:\n    branches: ["main"]\n\npermissions:\n  contents: read\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n        with:\n          persist-credentials: false\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: "20"\n          cache: yarn\n\n      - name: Install dependencies\n        run: yarn install --frozen-lockfile --non-interactive\n\n      - name: Type check\n        run: yarn typecheck\n\n      - name: Lint\n        run: yarn lint\n\n      - name: Build static site\n        run: yarn build\n''',
              encoding="utf-8",
          )
          PY

      - name: Add exact visual-preview dependencies
        run: yarn add --dev --exact playwright@1.55.0 wait-on@8.0.1 --ignore-scripts --non-interactive

      - name: Remove temporary remediation workflow
        run: rm -f .github/workflows/apply-pr3-review-fixes.yml

      - name: Verify fixes
        run: |
          yarn typecheck
          yarn lint
          yarn build

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components .github/workflows package.json yarn.lock
          git commit -m "fix: address PR review findings"
          git push origin HEAD:fix/manual-entry-overlap

  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build static site
        run: yarn build
