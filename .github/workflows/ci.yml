name: CI

on:
  pull_request:
  push:
    branches: ["main", "fix/manual-entry-overlap"]

permissions:
  contents: read

jobs:
  apply-option3-artwork:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/manual-entry-overlap'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/manual-entry-overlap

      - name: Decode exact Option 3 artwork
        run: |
          cat .option3-assets/p01 .option3-assets/p02 .option3-assets/p03 \
              .option3-assets/p04 .option3-assets/p05 .option3-assets/p06 \
              .option3-assets/p07 | base64 --decode > public/design/option3-background.avif
          test "$(stat -c%s public/design/option3-background.avif)" -eq 28301
          python <<'PY'
          from pathlib import Path

          component = Path("components/arcade/option3-hero.tsx")
          text = component.read_text(encoding="utf-8")
          old = 'src="design/option3-background.webp"'
          new = 'src="design/option3-background.avif"'
          if old not in text:
              raise SystemExit("Could not find the previous Option 3 image source")
          component.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f public/design/option3-background.webp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Validate assembled site
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn typecheck
          yarn lint
          yarn build

      - name: Commit exact artwork and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-option3-avif.yml
          rm -rf .option3-assets
          git add -A
          git commit -m "fix: use the exact Option 3 artwork as the hero background"
          git push origin HEAD:fix/manual-entry-overlap

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build static site
        run: yarn build