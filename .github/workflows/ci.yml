name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build production static site
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
          NEXT_PUBLIC_GA_IDS: "G-SJNYKL2864,G-41VM0C9NGM"
        run: yarn build

      - name: Verify Google Analytics initialization
        run: |
          python3 scripts/verify-google-analytics-html.py \
            out/index.html \
            G-SJNYKL2864 \
            G-SJNYKL2864 \
            G-41VM0C9NGM
