name: Refresh Yarn lockfile

on:
  push:
    branches:
      - feat/arcade-web-calculator
    paths:
      - package.json
      - .github/workflows/refresh-yarn-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/arcade-web-calculator

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Refresh lockfile
        run: yarn install --ignore-scripts --non-interactive

      - name: Commit refreshed lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git rm .github/workflows/refresh-yarn-lock.yml
          git commit -m "chore: refresh Yarn lockfile"
          git push origin HEAD:feat/arcade-web-calculator
