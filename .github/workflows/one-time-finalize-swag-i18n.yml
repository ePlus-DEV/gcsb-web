name: One-time finalize swag i18n

on:
  push:
    branches: [fix/swag-i18n]
    paths: [.github/workflows/one-time-finalize-swag-i18n.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/swag-i18n
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix remaining split translation nodes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/swag-drops/2026/[slug]/page.tsx')
          s = p.read_text()
          s = s.replace(
            'These were the official final 2025 Season 2 items for this tier. They explain the {meta.historicalEstimateLabel} projection, but they are not confirmed as 2026 rewards.',
            '{`These were the official final 2025 Season 2 items for this tier. They explain the ${meta.historicalEstimateLabel} projection, but they are not confirmed as 2026 rewards.`}',
          )
          p.write_text(s)

          p = Path('components/site/internal-page-shell.tsx')
          s = p.read_text()
          s = s.replace(
            '{updated ? <p className="internal-page-updated mt-4 text-sm text-slate-500">Last updated: {updated}</p> : null}',
            '{updated ? <p className="internal-page-updated mt-4 text-sm text-slate-500">{`Last updated: ${updated}`}</p> : null}',
          )
          s = s.replace(
            '<p>© {new Date().getFullYear()} ePlus.DEV. Independent community project.</p>',
            '<p>© {new Date().getFullYear()} ePlus.DEV. <span>Independent community project.</span></p>',
          )
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/swag-drops/2026/'[slug]'/page.tsx components/site/internal-page-shell.tsx
          git commit -m "fix: translate remaining internal swag copy"
          git push origin HEAD:fix/swag-i18n
