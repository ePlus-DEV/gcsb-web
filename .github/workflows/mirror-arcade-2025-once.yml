name: Mirror 2025 Arcade Swag Images (one-time)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  mirror:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/mirror-arcade-2026-swag-images'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: arcade-swag-2025-one-time
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inspect community archive image markup (temporary)
        run: |
          node --input-type=module <<'NODE'
          const url = "https://piarcadecompass.vercel.app/"
          const response = await fetch(url)
          const html = await response.text()
          console.log("Fetched", url, response.status, "bytes", html.length)
          for (const name of ["Ranger Vacuum Cleaner", "Champion Vacuum Cleaner", "Legend Vacuum Cleaner", "Sticker Sheet"]) {
            const pos = html.indexOf(name)
            console.log("ITEM", name, "offset", pos)
            if (pos > 0) console.log("IMAGES:", (html.slice(pos, pos + 2000).match(/<img[^>]+>/ig) || []).slice(0, 2).map(tag => tag.slice(0, 1000)).join(" | "))
          }
          const candidates = [
            "/images/2025 C1/Sticker Sheet.png",
            "/images/2025 C1/Arcade Sticker Sheet.png",
            "/images/2025 C1/The Arcade Sticker Sheet.png",
            "/images/2025 C1/Arcade Stickers.png",
            "/images/2025 C1/Sticker sheet.png",
            "/images/2025 C1/Arcade Sticker.png",
            "/images/2025 C1/Google Cloud Sticker Sheet.png",
            "/images/2025 C1/Sticker Sheet.gif",
          ]
          for (const path of candidates) {
            const uri = new URL(path, url)
            try {
              const res = await fetch(uri, { method: "HEAD", signal: AbortSignal.timeout(4000) })
              console.log("CHECK C1 STICKER", res.status, uri.href)
            } catch (error) {
              console.log("CHECK C1 STICKER FAILED", uri.href, error.message)
            }
          }
          const discourseFallback = "https://d2yds90mtvelsl.cloudfront.net/original/3X/d/f/df3d6054e5f7f8834f276ca888dbd61bc23d79a3.gif"
          try {
            const response = await fetch(discourseFallback, { method: "HEAD", signal: AbortSignal.timeout(4000) })
            console.log("CHECK DISCOURSE BASE62", response.status, discourseFallback)
          } catch (error) {
            console.log("CHECK DISCOURSE BASE62 FAILED", error.message)
          }
          NODE
      - name: Download and verify 2025 Season 1 and Season 2 images
        continue-on-error: true
        run: node scripts/mirror-arcade-2025-images.mjs
      - name: Commit recovered source images and local mapping
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/swag/2025 components/arcade/swag-history-images.ts
          if git diff --cached --quiet; then
            echo "No new 2025 images were mirrored."
            exit 0
          fi
          git commit -m "assets(arcade): self-host official 2025 swag history images"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
